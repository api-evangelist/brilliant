description: >-
  Brilliant is a consumer-first interactive STEM learning platform that delivers bite-sized,
  problem-solving-driven courses in math, computer science, data science, and science to over
  10 million learners on web, iOS, and Android. Brilliant for Educators offers free Premium
  access to K-12 teachers and students, with Google Classroom roster sync, COPPA/FERPA/GDPR
  compliance, and a teacher portal for class management. Brilliant does not publish a public
  developer API or partner SDK — the product is consumer- and classroom-facing, and integration
  with school ecosystems is limited to Google Classroom roster sync.
